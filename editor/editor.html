<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snapz — Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;1,900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="editor.css" />
</head>
<body>
<div id="app">

  <!-- ── Canvas area ─────────────────────────────────────── -->
  <div id="canvas-area">
    <div id="canvas-wrap">
      <canvas id="canvas"></canvas>

      <div id="drop-zone">
        <span class="dz-icon">📷</span>
        <p class="dz-title">Drop a screenshot here</p>
        <p class="dz-sub">or paste with ⌘V</p>
        <label class="dz-browse" for="file-input">Browse Files</label>
        <input type="file" id="file-input" accept="image/*" />
      </div>

      <button id="btn-clear-image" class="clear-btn" hidden>Clear image</button>
    </div>
  </div>

  <!-- ── Annotation selection toolbar (floating) ─────────── -->
  <div id="ann-toolbar">
    <input type="color" id="ann-tb-color" class="ann-tb-color" title="Color" value="#1A2B5C" />
    <button id="ann-tb-delete" class="ann-tb-delete" title="Delete (Del)">✕</button>
  </div>

  <!-- ── Sidebar ─────────────────────────────────────────── -->
  <aside id="sidebar">

    <div id="sb-header">
      <div class="sb-logo">Snapz</div>
    </div>

    <div id="tab-switcher">
      <button class="tab-btn active" data-tab="style">Style</button>
      <button class="tab-btn" data-tab="annotate">Annotate</button>
    </div>

    <div id="tab-panels">

      <!-- Style panel -->
      <div id="panel-style" class="panel active">

        <div class="ctrl-row">
          <span class="ctrl-label">Padding</span>
          <span class="ctrl-value" id="val-padding">48px</span>
        </div>
        <input type="range" id="sl-padding" class="slider" min="0" max="120" value="48" />

        <div class="ctrl-row">
          <span class="ctrl-label">Border Radius</span>
          <span class="ctrl-value" id="val-radius">12px</span>
        </div>
        <input type="range" id="sl-radius" class="slider" min="0" max="40" value="12" />

        <div class="ctrl-row">
          <span class="ctrl-label">Shadow</span>
          <span class="ctrl-value" id="val-shadow">40%</span>
        </div>
        <input type="range" id="sl-shadow" class="slider" min="0" max="100" value="40" />

        <div class="ctrl-row">
          <span class="ctrl-label">Inset Frame</span>
          <span class="ctrl-value" id="val-inset">12px</span>
        </div>
        <input type="range" id="sl-inset" class="slider" min="0" max="40" value="12" />
        <div class="inset-color-row">
          <input type="color" id="inset-color-picker" class="inset-color-swatch" value="#ffffff" title="Inset frame color" />
          <button id="btn-auto-sample" class="btn-color-action">Auto</button>
          <button id="btn-eyedropper" class="btn-color-action">Pick</button>
        </div>

        <div class="ctrl-row ctrl-row--solo">
          <span class="ctrl-label">Background</span>
        </div>
        <div class="swatch-grid" id="bg-swatches">
          <button class="swatch"        data-bg="flink"     title="Flink"></button>
          <button class="swatch"        data-bg="neonnight"  title="Neon Night"></button>
          <button class="swatch"        data-bg="lavender"   title="Lavender"></button>
          <button class="swatch"        data-bg="midnight"   title="Midnight"></button>
          <button class="swatch"        data-bg="magenta"    title="Magenta"></button>
          <button class="swatch"        data-bg="dusk"       title="Dusk"></button>
          <button class="swatch"        data-bg="blush"      title="Blush"></button>
          <button class="swatch active" data-bg="deepsea"    title="Deep Sea"></button>
          <button class="swatch"        data-bg="slate"      title="Slate"></button>
          <button class="swatch swatch--checker" data-bg="none" title="None"></button>
        </div>

        <!-- Picked color indicator (shown when a canvas color has been sampled) -->
        <div id="custom-color-row" class="custom-bg-row" style="display:none">
          <span id="custom-color-circle" class="custom-color-circle"></span>
          <span id="custom-color-hex" class="custom-color-hex">#ffffff</span>
        </div>

        <!-- Pick background color from screenshot -->
        <button id="btn-bg-eyedropper" class="bg-action-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 22l10-10"/><path d="M3.5 12.5 16 20l5-5-7.5-12.5L3.5 12.5z"/></svg>
          Pick from screenshot
        </button>

        <!-- Custom image background -->
        <button id="btn-bg-image" class="bg-action-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          Image background
        </button>
        <input type="file" id="bg-image-input" accept="image/*" style="display:none" />
        <div id="bg-image-preview" class="bg-image-preview" style="display:none">
          <img id="bg-image-thumb" alt="" />
          <button id="btn-remove-bg-image" class="btn-remove-bg-img" title="Remove">✕</button>
        </div>

        <div class="ctrl-row ctrl-row--solo">
          <span class="ctrl-label">Ratio</span>
        </div>
        <div class="pill-group">
          <button class="pill active" data-ratio="auto">Auto</button>
          <button class="pill" data-ratio="4:3">4:3</button>
          <button class="pill" data-ratio="3:2">3:2</button>
          <button class="pill" data-ratio="16:9">16:9</button>
          <button class="pill" data-ratio="1:1">1:1</button>
        </div>
        <div class="preset-header">
          <span class="ctrl-label">Presets</span>
          <button class="btn-set-default" id="btn-set-default">★ Set Default</button>
        </div>
        <div class="preset-save-row">
          <input type="text" id="preset-name-input" placeholder="Name this look…" maxlength="24" />
          <button class="btn-save-preset" id="btn-save-preset">Save</button>
        </div>
        <div class="preset-chips" id="preset-chips"></div>

      </div><!-- /panel-style -->

      <!-- Annotate panel -->
      <div id="panel-annotate" class="panel">

        <!-- Primary drawing tools — 3×2 grid -->
        <div class="ctrl-row ctrl-row--solo">
          <span class="ctrl-label">Tools</span>
        </div>
        <div class="tool-grid tool-grid--3col">
          <button class="tool-cell active" data-tool="draw" title="Freehand">
            <svg width="18" height="12" viewBox="0 0 18 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none">
              <path d="M1 9 C3 3 5 3 7 7 C9 11 11 11 13 7 C15 3 17 3 17 5"/>
            </svg>
          </button>
          <button class="tool-cell" data-tool="line"   title="Line">╱</button>
          <button class="tool-cell" data-tool="arrow"  title="Arrow">→</button>
          <button class="tool-cell" data-tool="rect"   title="Rectangle">□</button>
          <button class="tool-cell" data-tool="rect-r" title="Rounded Rect">
            <svg width="12" height="10" viewBox="0 0 16 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="pointer-events:none">
              <rect x="1" y="1" width="14" height="11" rx="3"/>
            </svg>
          </button>
          <button class="tool-cell" data-tool="ellipse" title="Ellipse — hold Shift for circle">○</button>
        </div>

        <!-- Special tools: highlight, text, zoom -->
        <div class="ctrl-row ctrl-row--solo" style="margin-top:10px">
          <span class="ctrl-label">Special</span>
        </div>
        <div class="tool-grid tool-grid--3col">
          <button class="tool-cell" data-tool="highlight" title="Highlight">
            <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor" opacity="0.55" style="pointer-events:none"><rect x="1" y="2" width="14" height="8"/></svg>
          </button>
          <button class="tool-cell tool-cell--serif" data-tool="text" title="Text">T</button>
          <button class="tool-cell" data-tool="zoom" title="Zoom Lens">⊕</button>
        </div>

        <!-- Tool-specific option rows (shown/hidden by JS) -->
        <div id="opt-highlight" class="tool-opts" style="display:none">
          <button class="tool-opt-pill active" data-hstyle="normal">Normal</button>
          <button class="tool-opt-pill" data-hstyle="rounded">Rounded</button>
        </div>

        <div id="opt-text" class="tool-opts" style="display:none">
          <button class="tool-opt-pill active" data-font="sans">Sans</button>
          <button class="tool-opt-pill" data-font="serif">Serif</button>
          <button class="tool-opt-pill" data-font="comic">Comic</button>
          <button class="tool-opt-pill" data-font="code">Code</button>
        </div>

        <div id="opt-zoom" class="tool-opts tool-opts--col" style="display:none">
          <div class="tool-opts-row">
            <button class="tool-opt-pill active" data-zshape="circle">⬤ Circle</button>
            <button class="tool-opt-pill" data-zshape="rect">□ Rect</button>
            <button class="tool-opt-pill" data-zshape="rect-r">▢ Rounded</button>
          </div>
          <div class="tool-opts-row" style="align-items:center;justify-content:space-between">
            <span class="ctrl-label" style="font-size:10px;margin:0">Zoom</span>
            <span class="ctrl-value" id="val-zoom-level" style="font-size:10px">2.5×</span>
          </div>
          <input type="range" id="sl-zoom-level" class="slider" min="15" max="50" value="25" step="5" />
          <input type="text" id="zoom-label-input" class="zoom-label-input" placeholder="Label…" maxlength="32" />
        </div>

        <!-- Annotation color -->
        <div class="ctrl-row ctrl-row--solo" style="margin-top:6px">
          <span class="ctrl-label">Color</span>
        </div>
        <div class="color-row">
          <button class="color-dot"        data-color="#E2186F" style="background:#E2186F" title="Flink Pink"></button>
          <button class="color-dot"        data-color="#FF7EB3" style="background:#FF7EB3" title="Light Pink"></button>
          <button class="color-dot"        data-color="#C4145F" style="background:#C4145F" title="Deep Pink"></button>
          <button class="color-dot active" data-color="#1A2B5C" style="background:#1A2B5C" title="Navy"></button>
          <button class="color-dot"        data-color="#3D5299" style="background:#3D5299" title="Mid Navy"></button>
          <button class="color-dot"        data-color="#CCC5E0" style="background:#CCC5E0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)" title="Lavender"></button>
          <button class="color-dot"        data-color="#ffffff" style="background:#ffffff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)" title="White"></button>
          <button class="color-dot color-dot--dark" data-color="#000000" style="background:#000000" title="Black"></button>
          <!-- Custom color: clicking opens native picker -->
          <button class="color-dot color-dot--custom" id="btn-ann-custom-color" title="Custom color" style="background:#1A2B5C">+</button>
        </div>
        <input type="color" id="ann-color-picker" value="#1A2B5C"
               style="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none" />
        <button class="bg-action-btn" id="btn-ann-color-eyedropper" style="margin-top:4px;margin-bottom:8px">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 22l10-10"/><path d="M3.5 12.5 16 20l5-5-7.5-12.5L3.5 12.5z"/></svg>
          Pick from canvas
        </button>

        <!-- Line width -->
        <div class="ctrl-row">
          <span class="ctrl-label">Line Width</span>
          <span class="ctrl-value" id="val-lw">3px</span>
        </div>
        <input type="range" id="sl-lw" class="slider" min="1" max="12" value="3" />

        <!-- Actions -->
        <div class="action-row">
          <button class="action-btn" id="btn-undo" disabled>↩ Undo</button>
          <button class="action-btn" id="btn-redo" disabled>↪ Redo</button>
        </div>
        <button class="action-btn action-btn--full" id="btn-clear-ann">🗑 Clear All</button>

        <p class="tip-text">Tip: Cmd+Z · Shift+Z · Shift+drag = circle · Del = delete selected</p>

      </div><!-- /panel-annotate -->

    </div><!-- /tab-panels -->

    <div id="export-area">
      <button class="export-btn export-btn--copy" id="btn-copy" disabled>⌘C  Copy to Clipboard</button>
      <button class="export-btn export-btn--primary" id="btn-export" disabled>↓  Export PNG</button>
    </div>

  </aside>
</div>
<script src="editor.js"></script>
</body>
</html>
