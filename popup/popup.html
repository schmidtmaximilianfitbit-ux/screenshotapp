<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snapz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;1,900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 260px;
      background: #0E0E25;
      color: #CCC5E0;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      padding: 14px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 14px;
    }

    header .logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #E2186F, #FF7EB3);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    header h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 20px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -0.5px;
      color: #FF7EB3;
      line-height: 1;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #1E3268;
      border-radius: 9px;
      background: #1A2B5C;
      color: #8896C5;
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      text-align: left;
    }

    .btn:hover {
      background: #1E3268;
      border-color: #FF7EB3;
      color: #CCC5E0;
    }

    .btn .icon { font-size: 14px; flex-shrink: 0; }

    .btn-primary {
      background: linear-gradient(135deg, #E2186F, #FF7EB3);
      border-color: transparent;
      color: #fff;
      font-weight: 700;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #C4145F, #E2186F);
      border-color: transparent;
      color: #fff;
    }

    .shortcut {
      margin-left: auto;
      font-size: 10px;
      color: rgba(255,255,255,0.45);
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 4px;
      padding: 2px 5px;
      letter-spacing: 0.3px;
      font-family: monospace;
    }

    .btn-primary .shortcut {
      color: rgba(255,255,255,0.7);
      background: rgba(0,0,0,0.2);
      border-color: rgba(255,255,255,0.25);
    }

    /* ── Recent captures ────────────────────────────────── */
    #recent-section { margin-top: 10px; }

    .recent-header {
      font-size: 9px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: #3D5299;
      margin-bottom: 6px;
    }

    .recent-thumbs {
      display: flex;
      gap: 5px;
    }

    .thumb-btn {
      position: relative;
      flex: 1;
      padding: 0;
      border: 1px solid #1E3268;
      border-radius: 6px;
      background: #1A2B5C;
      cursor: pointer;
      overflow: hidden;
      transition: border-color 0.15s, transform 0.15s;
    }

    .thumb-btn:hover {
      border-color: #FF7EB3;
      transform: translateY(-1px);
    }

    .thumb-btn img {
      display: block;
      width: 100%;
      height: 44px;
      object-fit: cover;
      border-radius: 5px;
    }

    .thumb-age {
      position: absolute;
      bottom: 3px;
      right: 4px;
      font-size: 9px;
      font-family: monospace;
      color: rgba(255,255,255,0.55);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">📷</div>
    <h1>Snapz</h1>
  </header>

  <div class="btn-group">
    <button class="btn btn-primary" id="btn-capture-tab">
      <span class="icon">📸</span>
      Capture Tab
      <span class="shortcut">⌘⇧S</span>
    </button>

    <button class="btn" id="btn-capture-region">
      <span class="icon">✂️</span>
      Capture Region
      <span class="shortcut">⌘⇧A</span>
    </button>
  </div>

  <div id="recent-section" style="display:none">
    <div style="height:1px;background:rgba(255,255,255,0.06);margin:10px 0 8px"></div>
    <div class="recent-header">Recent</div>
    <div class="recent-thumbs" id="recent-thumbs"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
