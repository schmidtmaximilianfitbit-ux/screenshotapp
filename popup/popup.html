<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SnapBeauty</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      background: #0c1018;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      padding: 14px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    header .logo {
      width: 26px;
      height: 26px;
      background: linear-gradient(135deg, #f97316, #ef4444);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    header h1 .snap   { color: #f97316; }
    header h1 .beauty { color: #e2e8f0; }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #1e2736;
      border-radius: 8px;
      background: #111827;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      text-align: left;
    }

    .btn:hover {
      background: #1a2333;
      border-color: #f97316;
      color: #e2e8f0;
    }

    .btn .icon { font-size: 15px; flex-shrink: 0; }

    .btn-primary {
      background: linear-gradient(135deg, #f97316, #ea580c);
      border-color: transparent;
      color: #fff;
      font-weight: 600;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #fb923c, #f97316);
      border-color: transparent;
    }

    .shortcut {
      margin-left: auto;
      font-size: 10px;
      color: #64748b;
      background: rgba(0,0,0,0.3);
      border: 1px solid #1e2736;
      border-radius: 4px;
      padding: 2px 5px;
      letter-spacing: 0.4px;
      font-family: monospace;
    }

    .divider {
      height: 1px;
      background: #151c28;
      margin: 8px 0;
    }

    /* ── Recent captures ────────────────────────────────── */
    #recent-section { margin-top: 8px; }

    .recent-header {
      font-size: 10px;
      font-family: monospace;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #475569;
      margin-bottom: 7px;
    }

    .recent-thumbs {
      display: flex;
      gap: 6px;
    }

    .thumb-btn {
      position: relative;
      flex: 1;
      padding: 0;
      border: 1px solid #1e2736;
      border-radius: 6px;
      background: #111827;
      cursor: pointer;
      overflow: hidden;
      transition: border-color 0.15s, transform 0.15s;
    }

    .thumb-btn:hover {
      border-color: #f97316;
      transform: translateY(-1px);
    }

    .thumb-btn img {
      display: block;
      width: 100%;
      height: 48px;
      object-fit: cover;
      border-radius: 5px;
    }

    .thumb-age {
      position: absolute;
      bottom: 3px;
      right: 4px;
      font-size: 9px;
      font-family: monospace;
      color: rgba(255,255,255,0.55);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">📷</div>
    <h1><span class="snap">Snap</span><span class="beauty">Beauty</span></h1>
  </header>

  <div class="btn-group">
    <button class="btn btn-primary" id="btn-capture-tab">
      <span class="icon">📸</span>
      Capture Tab
      <span class="shortcut">⌘⇧S</span>
    </button>

    <button class="btn" id="btn-capture-region">
      <span class="icon">✂️</span>
      Capture Region
    </button>

    <div class="divider"></div>

    <button class="btn" id="btn-settings">
      <span class="icon">⚙️</span>
      Settings
    </button>
  </div>

  <div id="recent-section" style="display:none">
    <div class="divider" style="margin-top:10px"></div>
    <div class="recent-header">Recent</div>
    <div class="recent-thumbs" id="recent-thumbs"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
